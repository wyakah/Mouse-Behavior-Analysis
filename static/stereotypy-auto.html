<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stereotypy · Automatic analysis</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/batch.css"><link rel="stylesheet" href="/static/recording-setup.css"><link rel="stylesheet" href="/static/live.css"><style>
